[build-system]
requires = [ "hatchling >= 1.26, < 1.32",]
build-backend = "hatchling.build"

[project]
name = "entropic_editor"
version = "0.0.20"
description = "An interactive editor for game data"
requires-python = ">=3.12"
classifiers = [ "Programming Language :: Python :: 3", "Operating System :: MacOS",]
dependencies = [ "glfw", "imgui-bundle", "numpy", "PyOpenGL", "pillow", "qrcode", "regex",]
license = "MIT"
license-files = [ "LICEN[CS]E*",]
[[project.authors]]
name = "Tomas Stegemann"
email = "tomas@entropicengineering.com"

[project.urls]
Homepage = "https://github.com/sunsigil/entropic-editor"

[tool.pyright]
venvPath = "."
venv = "venv"
